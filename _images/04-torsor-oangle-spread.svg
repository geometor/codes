<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic codes-diagram" viewBox="-1.5200 -3.9200 6.4400 5.5400">
  <style>
svg.codes-diagram {
    background-color: #111318;
    border: 1px solid #2e3440;
    border-radius: 6px;
    width: 100%;
    height: auto;
    max-height: 560px;
    display: block;
    margin: 0.75rem auto;
    user-select: none;
    overflow: hidden;
    cursor: grab;
}
svg.codes-diagram:active {
    cursor: grabbing;
}
@media (prefers-color-scheme: light) {
    svg.codes-diagram {
        background-color: #fbfbfd;
        border-color: #d8dee9;
    }
    svg.codes-diagram .Point {
        stroke: #fbfbfd !important;
    }
    svg.codes-diagram .Point.given {
        fill: #1a1d24 !important;
    }
    svg.codes-diagram .label-halo {
        stroke: #fbfbfd !important;
    }
    svg.codes-diagram .label-fill {
        fill: #1a1d24 !important;
    }
    svg.codes-diagram .Line,
    svg.codes-diagram .Segment {
        stroke: #4c566a;
    }
    svg.codes-diagram .callout-box {
        fill: rgba(255, 255, 255, 0.92);
    }
    svg.codes-diagram .callout-text {
        fill: #1a1d24;
    }
}
.Line, .Segment {
    stroke: #9aa5b4;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
    stroke-width: 1.35px;
    fill: none;
    opacity: 0.84;
    transition: stroke-width 0.15s ease, opacity 0.15s ease, filter 0.15s ease;
}
.Circle {
    stroke: #c678dd;
    vector-effect: non-scaling-stroke;
    stroke-width: 1.45px;
    fill: none;
    opacity: 0.86;
    transition: stroke-width 0.15s ease, opacity 0.15s ease, filter 0.15s ease;
}
.Polygon {
    fill: rgba(97, 175, 239, 0.09);
    stroke: #61afef;
    vector-effect: non-scaling-stroke;
    stroke-width: 1.85px;
    stroke-linejoin: round;
    transition: stroke-width 0.15s ease, fill-opacity 0.15s ease;
}
.Polygon.golden {
    fill: rgba(229, 192, 123, 0.14);
    stroke: #e5c07b;
}
.Point {
    fill: #e5c07b;
    stroke: #111318;
    vector-effect: non-scaling-stroke;
    stroke-width: 1.4px;
    transition: r 0.15s ease, filter 0.15s ease;
}
.Point.given {
    fill: #ffffff;
}
.Point.result, .Point.center, .Point.target {
    fill: #00e5ff;
}
.Point.golden {
    fill: #f0c674;
}
.Point.midpoint, .Point.foot {
    fill: #98c379;
}
.Line.guide, .Circle.guide, .Segment.guide, .Point.guide {
    stroke-dasharray: 4 4;
    opacity: 0.42;
    stroke-width: 0.95px;
}
.Line.axis, .Segment.axis, .Line.euler, .Segment.euler {
    stroke: #e06c75;
    stroke-width: 1.9px;
    opacity: 0.94;
}
.Line.bisector, .Segment.bisector, .Line.altitude, .Segment.altitude, .Line.median, .Segment.median {
    stroke: #98c379;
    stroke-width: 1.5px;
    opacity: 0.88;
}
.Line.golden, .Segment.golden, .Circle.golden {
    stroke: #e5c07b;
    stroke-width: 1.85px;
}
.Circle.circumcircle {
    stroke: #e06c75;
    stroke-width: 1.55px;
}
.Circle.ninepoint {
    stroke: #61afef;
    stroke-width: 1.65px;
}
.Circle.incircle {
    stroke: #e5c07b;
    stroke-width: 1.55px;
}
.callout-box {
    fill: rgba(24, 28, 36, 0.88);
    stroke: #61afef;
    vector-effect: non-scaling-stroke;
    stroke-width: 1px;
    rx: 3px;
}
.callout-box.spread-box {
    stroke: #e5c07b;
}
.callout-box.paradigm-box {
    stroke: #c678dd;
}
.callout-text {
    fill: #eceff4;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
}
.element-group {
    cursor: pointer;
}
.element-group.svg-hovered .Line,
.element-group.svg-hovered .Segment,
.element-group.svg-hovered .Circle,
.element-group.svg-hovered .Polygon {
    stroke: #00e5ff !important;
    stroke-width: 2.8px !important;
    opacity: 1.0 !important;
    filter: drop-shadow(0 0 5px rgba(0, 229, 255, 0.75));
}
.element-group.svg-hovered .Point {
    fill: #00e5ff !important;
    filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.9));
}
.svg-control-btn {
    cursor: pointer;
}
.svg-control-btn rect {
    fill: rgba(30, 34, 42, 0.85);
    stroke: #5c6370;
    stroke-width: 1px;
    vector-effect: non-scaling-stroke;
    rx: 3px;
}
.svg-control-btn:hover rect {
    fill: rgba(55, 62, 76, 0.95);
    stroke: #00e5ff;
}
.svg-control-btn text {
    fill: #e5e9f0;
    font-family: sans-serif;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
}
svg.hide-labels .labels-layer,
svg.hide-labels .callouts-layer {
    display: none;
}
svg.hide-guides .guide {
    display: none;
}
</style>
  <g class="svg-viewport">
    <g class="polygons-layer">
    <g class="element-group" data-ref="&lt; A B C &gt;"><polygon class="Polygon " points="0.0000,-0.0000 4.0000,-0.0000 1.0000,-3.0000"><title>&lt; A B C &gt;</title></polygon></g>
    </g>
    <g class="circles-layer">
    <g class="element-group" data-ref="( C A )"><circle class="Circle guide" cx="1.0000" cy="-3.0000" r="3.1623" data-quadrance="10"><title>( C A ) (Q = 10)</title></circle></g>
    <g class="element-group" data-ref="( A D )"><circle class="Circle guide" cx="0.0000" cy="-0.0000" r="2.0000" data-quadrance="4"><title>( A D ) (Q = 4)</title></circle></g>
    <g class="element-group" data-ref="( D A )"><circle class="Circle guide" cx="2.0000" cy="-0.0000" r="2.0000" data-quadrance="4"><title>( D A ) (Q = 4)</title></circle></g>
    </g>
    <g class="lines-layer">
    <g class="element-group" data-ref="[ A B ]"><line class="Line guide" x1="-11.5000" y1="-0.0000" x2="11.5000" y2="-0.0000"><title>[ A B ]</title></line></g>
    <g class="element-group" data-ref="[ C H ]"><line class="Line bisector" x1="1.0000" y1="-13.2321" x2="1.0000" y2="9.7679"><title>[ C H ]</title></line></g>
    <g class="element-group" data-ref="/ A B /"><path class="Segment axis" d="M 0.0000,-0.0000 L 2.0000,-0.0000 L 4.0000,-0.0000" data-quadrance="16"><title>/ A B / (Q = 16)</title></path></g>
    <g class="element-group" data-ref="/ A C /"><path class="Segment golden" d="M 0.0000,-0.0000 L 0.5000,-1.5000 L 1.0000,-3.0000" data-quadrance="10"><title>/ A C / (Q = 10)</title></path></g>
    <g class="element-group" data-ref="/ B C /"><path class="Segment " d="M 4.0000,-0.0000 L 2.5000,-1.5000 L 1.0000,-3.0000" data-quadrance="18"><title>/ B C / (Q = 18)</title></path></g>
    <g class="element-group" data-ref="/ C H /"><path class="Segment altitude" d="M 1.0000,-3.0000 L 1.0000,-1.5000 L 1.0000,-0.0000" data-quadrance="9"><title>/ C H / (Q = 9)</title></path></g>
    </g>
    <g class="points-layer">
    <g class="element-group" data-ref="A"><circle class="Point given" cx="0.0000" cy="-0.0000" r="0.0926" data-latex-xy="(0, 0)" data-exact-xy="[0, 0]"><title>A = [0, 0]</title></circle></g>
    <g class="element-group" data-ref="B"><circle class="Point given" cx="4.0000" cy="-0.0000" r="0.0926" data-latex-xy="(4, 0)" data-exact-xy="[4, 0]"><title>B = [4, 0]</title></circle></g>
    <g class="element-group" data-ref="C"><circle class="Point given" cx="1.0000" cy="-3.0000" r="0.0926" data-latex-xy="(1, 3)" data-exact-xy="[1, 3]"><title>C = [1, 3]</title></circle></g>
    <g class="element-group" data-ref="H"><circle class="Point midpoint" cx="1.0000" cy="-0.0000" r="0.0741" data-latex-xy="(1, 0)" data-exact-xy="[1, 0]"><title>H = [1, 0]</title></circle></g>
    </g>
    <g class="callouts-layer">
    <g class="element-group" data-ref="/ A C /"><rect class="callout-box paradigm-box" x="-1.6506" y="-1.7024" width="2.1012" height="0.2048" /><text class="callout-text" x="-0.6000" y="-1.6000" font-size="0.1321">v = C -v A = (1, 3), Q=10</text></g>
    <g class="element-group" data-ref="/ A B /"><rect class="callout-box" x="0.9494" y="0.5976" width="2.1012" height="0.2048" /><text class="callout-text" x="2.0000" y="0.7000" font-size="0.1321">u = B -v A = (4, 0), Q=16</text></g>
    <g class="element-group" data-ref="&lt; A B C &gt;"><rect class="callout-box spread-box" x="2.0701" y="-2.3024" width="2.2597" height="0.2048" /><text class="callout-text" x="3.2000" y="-2.2000" font-size="0.1321">s(BAC) = 9/10 | S_A = 4 &gt; 0</text></g>
    <g class="element-group" data-ref="/ C H /"><rect class="callout-box paradigm-box" x="0.4719" y="-1.1024" width="2.6562" height="0.2048" /><text class="callout-text" x="1.8000" y="-1.0000" font-size="0.1321">oangle mod 2pi vs eqangle mod pi</text></g>
    </g>
    <g class="labels-layer">
    <g class="element-group" data-ref="A"><text class="label-halo" x="0.1222" y="-0.1074" font-family="sans-serif" font-size="0.1835" font-weight="600" stroke="#111318" stroke-width="0.0459" stroke-linejoin="round" fill="none">A</text><text class="label-fill" x="0.1222" y="-0.1074" font-family="sans-serif" font-size="0.1835" font-weight="600" fill="#f0f4f8">A</text></g>
    <g class="element-group" data-ref="B"><text class="label-halo" x="4.1222" y="-0.1074" font-family="sans-serif" font-size="0.1835" font-weight="600" stroke="#111318" stroke-width="0.0459" stroke-linejoin="round" fill="none">B</text><text class="label-fill" x="4.1222" y="-0.1074" font-family="sans-serif" font-size="0.1835" font-weight="600" fill="#f0f4f8">B</text></g>
    <g class="element-group" data-ref="C"><text class="label-halo" x="1.1222" y="-3.1074" font-family="sans-serif" font-size="0.1835" font-weight="600" stroke="#111318" stroke-width="0.0459" stroke-linejoin="round" fill="none">C</text><text class="label-fill" x="1.1222" y="-3.1074" font-family="sans-serif" font-size="0.1835" font-weight="600" fill="#f0f4f8">C</text></g>
    <g class="element-group" data-ref="H"><text class="label-halo" x="1.1222" y="-0.1074" font-family="sans-serif" font-size="0.1835" font-weight="600" stroke="#111318" stroke-width="0.0459" stroke-linejoin="round" fill="none">H</text><text class="label-fill" x="1.1222" y="-0.1074" font-family="sans-serif" font-size="0.1835" font-weight="600" fill="#f0f4f8">H</text></g>
    </g>
  </g>
  <g class="svg-controls">
    <g class="svg-control-btn" data-action="zoom-in"><rect x="2.5560" y="-3.8470" width="0.4192" height="0.2705" /><text x="2.7656" y="-3.7117" style="font-size:0.1217px">+</text></g>
    <g class="svg-control-btn" data-action="zoom-out"><rect x="3.0239" y="-3.8470" width="0.4192" height="0.2705" /><text x="3.2336" y="-3.7117" style="font-size:0.1217px">−</text></g>
    <g class="svg-control-btn" data-action="reset"><rect x="3.4919" y="-3.8470" width="0.4192" height="0.2705" /><text x="3.7015" y="-3.7117" style="font-size:0.1217px">⟲</text></g>
    <g class="svg-control-btn" data-action="labels"><rect x="3.9598" y="-3.8470" width="0.4192" height="0.2705" /><text x="4.1694" y="-3.7117" style="font-size:0.1217px">Lbl</text></g>
    <g class="svg-control-btn" data-action="guides"><rect x="4.4277" y="-3.8470" width="0.4192" height="0.2705" /><text x="4.6373" y="-3.7117" style="font-size:0.1217px">Gde</text></g>
  </g>
  <script>
(function() {
  if (window.__codesSvgInit) return;
  window.__codesSvgInit = true;

  function initDiagram(svg) {
    if (svg.dataset.initialized) return;
    svg.dataset.initialized = "true";
    const vp = svg.querySelector(".svg-viewport");
    if (!vp) return;

    let scale = 1, tx = 0, ty = 0;
    let dragging = false, startX = 0, startY = 0;

    function applyTransform() {
      vp.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
    }

    svg.addEventListener("wheel", function(e) {
      e.preventDefault();
      const rect = svg.getBoundingClientRect();
      const vb = svg.viewBox.baseVal;
      const mx = vb.x + ((e.clientX - rect.left) / rect.width) * vb.width;
      const my = vb.y + ((e.clientY - rect.top) / rect.height) * vb.height;
      const factor = e.deltaY > 0 ? 1 / 1.15 : 1.15;
      const newScale = Math.min(Math.max(scale * factor, 0.25), 12);
      tx = mx - (mx - tx) * (newScale / scale);
      ty = my - (my - ty) * (newScale / scale);
      scale = newScale;
      applyTransform();
    }, { passive: false });

    svg.addEventListener("mousedown", function(e) {
      if (e.target.closest(".svg-controls")) return;
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    window.addEventListener("mousemove", function(e) {
      if (!dragging) return;
      const rect = svg.getBoundingClientRect();
      const vb = svg.viewBox.baseVal;
      const dx = ((e.clientX - startX) / rect.width) * vb.width;
      const dy = ((e.clientY - startY) / rect.height) * vb.height;
      startX = e.clientX;
      startY = e.clientY;
      tx += dx;
      ty += dy;
      applyTransform();
    });

    window.addEventListener("mouseup", function() {
      dragging = false;
    });

    svg.querySelectorAll(".svg-control-btn").forEach(function(btn) {
      btn.addEventListener("click", function(e) {
        e.stopPropagation();
        const action = btn.dataset.action;
        if (action === "zoom-in") { scale = Math.min(scale * 1.25, 12); applyTransform(); }
        else if (action === "zoom-out") { scale = Math.max(scale / 1.25, 0.25); applyTransform(); }
        else if (action === "reset") { scale = 1; tx = 0; ty = 0; applyTransform(); }
        else if (action === "labels") { svg.classList.toggle("hide-labels"); }
        else if (action === "guides") { svg.classList.toggle("hide-guides"); }
      });
    });
  }

  function setupHoverSync() {
    document.querySelectorAll("svg.codes-diagram").forEach(initDiagram);

    document.addEventListener("mouseover", function(e) {
      const refEl = e.target.closest("[data-ref]");
      if (!refEl) return;
      const ref = refEl.dataset.ref;
      if (!ref) return;
      document.querySelectorAll(`.element-group[data-ref="${CSS.escape(ref)}"]`).forEach(el => el.classList.add("svg-hovered"));
      document.querySelectorAll(`.geom-ref[data-ref="${CSS.escape(ref)}"]`).forEach(el => el.classList.add("ref-hovered"));
    });

    document.addEventListener("mouseout", function(e) {
      const refEl = e.target.closest("[data-ref]");
      if (!refEl) return;
      const ref = refEl.dataset.ref;
      if (!ref) return;
      document.querySelectorAll(`.element-group[data-ref="${CSS.escape(ref)}"]`).forEach(el => el.classList.remove("svg-hovered"));
      document.querySelectorAll(`.geom-ref[data-ref="${CSS.escape(ref)}"]`).forEach(el => el.classList.remove("ref-hovered"));
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupHoverSync);
  } else {
    setupHoverSync();
  }
})();
</script>
</svg>
