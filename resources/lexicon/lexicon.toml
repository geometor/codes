# Canonical lexicon for geometor.codes.
#
# One table per canonical concept: [entry.<canonical_name>]
# Fields: kind, family, summary, optional etc_x (ETC center number), and alias
# lists per system: etc, elements, model, alphageometry, newclid, sympy,
# system_e, geocoq, mathlib4, gibert.
# Conventions: resources/lexicon/conventions.md

[meta]
version = 1
seed = "geometor.etc ops.py"
systems = ["etc", "elements", "model", "alphageometry", "newclid", "sympy", "system_e", "geocoq", "mathlib4", "gibert"]
families = ["primitive", "incidence", "order", "congruence", "parallel", "circle", "similarity", "area", "measure", "triangle", "triangle_center", "transformation", "projective", "coordinates"]

# etc ops.py functions that are API plumbing rather than geometric concepts.
[meta.etc_infrastructure]
names = [
  "get_center_concordance", "create_model", "add_point", "add_line", "add_circle",
  "add_polygon", "add_segment", "promote_point_to_top", "construct_reference_triangle",
  "construct_baseline_triangle", "exact_center_point", "build_symbolic_collection_1_model",
  "eval_barycentric_point", "eval_trilinear_point",
]

# ---------------------------------------------------------------- objects

[entry.point]
kind = "object"
family = "primitive"
summary = "A location; that which has no part."
sympy = ["Point", "Point2D"]
system_e = ["Point"]
geocoq = ["Tpoint"]

[entry.line]
kind = "object"
family = "primitive"
summary = "An infinite straight line."
sympy = ["Line", "Line2D"]
system_e = ["Line"]
model = ["construct_line"]
alphageometry = ["line"]

[entry.segment]
kind = "object"
family = "primitive"
summary = "A bounded straight line between two endpoints."
sympy = ["Segment", "Segment2D"]
system_e = ["Segment"]
model = ["set_segment"]
elements = ["segment"]

[entry.ray]
kind = "object"
family = "primitive"
summary = "A half-line from an origin through a point."
sympy = ["Ray", "Ray2D"]
geocoq = ["Out"]

[entry.circle]
kind = "object"
family = "primitive"
summary = "Locus of points at a given distance from a center."
sympy = ["Circle"]
system_e = ["Circle"]
model = ["construct_circle"]
elements = ["circle"]
mathlib4 = ["EuclideanGeometry.Sphere"]

[entry.angle]
kind = "object"
family = "primitive"
summary = "The inclination of two rays from a common vertex."
system_e = ["Angle"]
model = ["set_angle"]
mathlib4 = ["EuclideanGeometry.angle"]

[entry.triangle]
kind = "object"
family = "primitive"
summary = "Three non-collinear points and their sides."
sympy = ["Triangle"]
system_e = ["Triangle"]
alphageometry = ["triangle"]

[entry.polygon]
kind = "object"
family = "primitive"
summary = "A closed chain of segments."
sympy = ["Polygon"]
model = ["set_polygon"]

[entry.ellipse]
kind = "object"
family = "primitive"
summary = "A conic with eccentricity less than one."
sympy = ["Ellipse"]

[entry.parabola]
kind = "object"
family = "primitive"
summary = "A conic with eccentricity one."
sympy = ["Parabola"]

