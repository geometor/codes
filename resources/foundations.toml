[systems.geometor_model]
name = "geometor.model"
short = "geometor.model"
ladder = "L1"
archetype = "analytic-cas"
core = true
summary = "Believe it because the figure is built exactly — algebraic coordinates from ruler-and-compass intersections — and every asserted relation reduces to zero."
upstream = "https://github.com/geometor/model"
dossier = "systems/geometor-model"
primitives = ["Point", "Line", "Circle", "Polygon", "Algebraic number"]
trusts = ["model_zero_test", "sympy_cas"]
findings = [
  "zero_test is the single truth oracle for every assert_*; `by=` citations are recorded, not checked.",
  "zero_test is exact on most paths (expansion, ℚ(φ)/ℚ(√φ) field arithmetic, minimal_polynomial) but accepts |evalf(80)| < 1e-65 for large constant expressions (algebra.py:247-251) — a candidate for a strict mode.",
  "A witness certifies one figure (L1); with free symbolic coordinates the same check certifies generic truth (L2) — see the showcase generic witnesses.",
  "No order predicates (betweenness, same side): Pasch-type statements are out of reach.",
