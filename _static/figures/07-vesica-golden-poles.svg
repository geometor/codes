    <g class="element-group" data-ref="I"><circle class="Point golden" cx="0.5000" cy="1.9365" r="0.0773" data-latex-xy="(\frac{1}{2}, - \frac{\sqrt{15}}{2})" data-exact-xy="[1/2, -sqrt(15)/2]"><title>I = [1/2, -sqrt(15)/2]</title></circle></g>
