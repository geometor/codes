    <g class="svg-control-btn" data-action="zoom-out"><rect x="0.9815" y="-3.2838" width="0.4375" height="0.2822" /><text x="1.2002" y="-3.1427" style="font-size:0.1270px">−</text></g>
    <g class="svg-control-btn" data-action="reset"><rect x="1.4698" y="-3.2838" width="0.4375" height="0.2822" /><text x="1.6885" y="-3.1427" style="font-size:0.1270px">⟲</text></g>
